name: product-variant-resolver

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-variant-resolver:lite
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      PVR_CATALOG_PATH: /app/data/catalog.json
      PVR_BENCHMARK_PATH: /app/data/benchmark.json
      PVR_UI_PATH: /app/ui
      PVR_BACKEND: offline
      PVR_DENSE_PROVIDER: hashing-v1
      PVR_DENSE_DIMENSIONS: "192"
      PVR_RERANKER_PROVIDER: heuristic-v1
      PVR_RERANKER_ENABLED: "false"
      PVR_POLICY_VERSION: fixture-v1-rrf-trained-v2
      PVR_CANDIDATE_LIMIT: "25"
      PVR_DEBUG_ENABLED: "true"
      PVR_TRACING_ENABLED: "false"
    ports:
      - "127.0.0.1:${PVR_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${PVR_MODEL_CACHE_PATH:-./model-cache}
        target: /app/model-cache
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: pvr
      POSTGRES_USER: pvr
      POSTGRES_PASSWORD: pvr-local-only
    volumes:
      - pvr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvr -d pvr"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${PVR_POSTGRES_PORT:-5432}:5432"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-variant-resolver:lite
    profiles: ["postgres"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PVR_DATABASE_URL: postgresql+psycopg://pvr:pvr-local-only@postgres:5432/pvr
    command:
      - alembic
      - upgrade
      - head
    restart: "no"

volumes:
  pvr-postgres-data:
