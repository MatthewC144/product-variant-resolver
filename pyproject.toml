[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-variant-resolver"
version = "0.1.0"
description = "Deterministic offline-first product variant resolver MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  # pvr-report uses FastAPI TestClient; current Starlette releases require httpx2.
  "httpx2>=2,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
ml = ["numpy>=2,<3", "scikit-learn>=1.6,<2", "sentence-transformers>=3.4,<4"]
observability = ["opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
pvr-evaluate = "product_variant_resolver.evaluation:main"
pvr-ingest = "product_variant_resolver.postgres_ingestion:main"
pvr-stage-releases = "product_variant_resolver.release_staging:main"
pvr-import-release-staging = "product_variant_resolver.postgres_release_staging:main"
pvr-review-release-castings = "product_variant_resolver.release_casting_review:main"
pvr-build-release-casting-review-batch = "product_variant_resolver.release_casting_review_batch:main"
pvr-record-release-casting-decision = "product_variant_resolver.release_casting_review_decisions:main"
pvr-materialize-release-casting-review-families = "product_variant_resolver.release_casting_review_materialization:main"
pvr-project-local-release-review-family-knowledge = "product_variant_resolver.release_casting_review_knowledge:main"
pvr-evaluate-local-release-review-families = "product_variant_resolver.release_casting_review_evaluation:main"
pvr-develop-human-knowledge-admission = "product_variant_resolver.human_knowledge_false_positive_development:main"
pvr-select-human-knowledge-admission = "product_variant_resolver.human_knowledge_admission_development:main"
pvr-select-human-knowledge-reranker = "product_variant_resolver.human_knowledge_reranker_development:main"
pvr-select-human-knowledge-anchor-admission = "product_variant_resolver.human_knowledge_anchor_admission_development:main"
pvr-materialize-embeddings = "product_variant_resolver.postgres_embeddings:main"
pvr-report = "product_variant_resolver.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
