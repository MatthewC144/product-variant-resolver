[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-variant-resolver"
version = "0.1.0"
description = "Deterministic offline-first product variant resolver MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
ml = ["numpy>=2,<3", "scikit-learn>=1.6,<2", "sentence-transformers>=3.4,<4"]
observability = ["opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2"]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
pvr-evaluate = "product_variant_resolver.evaluation:main"
pvr-report = "product_variant_resolver.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
