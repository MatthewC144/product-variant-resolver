[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-variant-resolver"
version = "0.1.0"
description = "Deterministic offline-first product variant resolver MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  # pvr-report uses FastAPI TestClient; current Starlette releases require httpx2.
  "httpx2>=2,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
ml = ["numpy>=2,<3", "scikit-learn>=1.6,<2", "sentence-transformers>=3.4,<4"]
reranking = [
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
  "sentence-transformers==3.4.1",
  "torch==2.7.1",
  "safetensors>=0.5,<1",
]
observability = ["opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
pvr-evaluate = "product_variant_resolver.evaluation:main"
pvr-evaluate-image-search = "product_variant_resolver.image_search_evaluation:main"
pvr-compare-image-search-rankers = "product_variant_resolver.image_search_ranking_development:main"
pvr-calibrate-image-search-pointwise = "product_variant_resolver.image_search_pointwise_calibration:main"
pvr-audit-pointwise-no-match-readiness = "product_variant_resolver.pointwise_no_match_readiness:main"
pvr-materialize-pointwise-no-match-governance = "product_variant_resolver.pointwise_no_match_governance:main"
pvr-materialize-domain-ranker-governance = "product_variant_resolver.domain_ranker_governance:main"
pvr-freeze-domain-ranker-partitions = "product_variant_resolver.domain_ranker_partitions:main"
pvr-mine-domain-ranker-hard-negatives = "product_variant_resolver.domain_ranker_hard_negatives:main"
pvr-train-domain-ranker = "product_variant_resolver.domain_ranker_training:main"
pvr-compare-domain-rankers = "product_variant_resolver.domain_ranker_comparison:main"
pvr-materialize-domain-ranker-v2-governance = "product_variant_resolver.domain_ranker_v2_governance:main"
pvr-author-domain-ranker-v2-queries = "product_variant_resolver.domain_ranker_v2_authoring:main"
pvr-freeze-domain-ranker-v2-candidate-pools = "product_variant_resolver.domain_ranker_v2_candidate_pools:main"
pvr-repair-domain-ranker-v2-latency = "product_variant_resolver.domain_ranker_v2_latency_repair:main"
pvr-calibrate-pointwise-three-class = "product_variant_resolver.pointwise_three_class_calibration:main"
pvr-audit-pointwise-policy-holdout = "product_variant_resolver.pointwise_policy_holdout_readiness:main"
pvr-evaluate-pointwise-no-match-holdout = "product_variant_resolver.pointwise_no_match_holdout_evaluation:main"
pvr-evaluate-pointwise-balanced-holdout = "product_variant_resolver.pointwise_balanced_holdout_evaluation:main"
pvr-ingest = "product_variant_resolver.postgres_ingestion:main"
pvr-stage-releases = "product_variant_resolver.release_staging:main"
pvr-import-release-staging = "product_variant_resolver.postgres_release_staging:main"
pvr-review-release-castings = "product_variant_resolver.release_casting_review:main"
pvr-build-release-casting-review-batch = "product_variant_resolver.release_casting_review_batch:main"
pvr-record-release-casting-decision = "product_variant_resolver.release_casting_review_decisions:main"
pvr-materialize-release-casting-review-families = "product_variant_resolver.release_casting_review_materialization:main"
pvr-project-local-release-review-family-knowledge = "product_variant_resolver.release_casting_review_knowledge:main"
pvr-evaluate-local-release-review-families = "product_variant_resolver.release_casting_review_evaluation:main"
pvr-develop-human-knowledge-admission = "product_variant_resolver.human_knowledge_false_positive_development:main"
pvr-select-human-knowledge-admission = "product_variant_resolver.human_knowledge_admission_development:main"
pvr-select-human-knowledge-reranker = "product_variant_resolver.human_knowledge_reranker_development:main"
pvr-select-human-knowledge-anchor-admission = "product_variant_resolver.human_knowledge_anchor_admission_development:main"
pvr-evaluate-local-release-review-family-anchor-admission = "product_variant_resolver.release_casting_review_anchor_evaluation:main"
pvr-develop-human-knowledge-anchor-confidence = "product_variant_resolver.human_knowledge_anchor_confidence_development:main"
pvr-develop-human-knowledge-identity-contradiction = "product_variant_resolver.human_knowledge_identity_contradiction_development:main"
pvr-develop-human-knowledge-identity-envelope = "product_variant_resolver.human_knowledge_identity_envelope_development:main"
pvr-develop-human-knowledge-identity-claim-graph = "product_variant_resolver.human_knowledge_identity_claim_graph_development:main"
pvr-develop-human-knowledge-identity-certificate = "product_variant_resolver.human_knowledge_identity_certificate_development:main"
pvr-materialize-embeddings = "product_variant_resolver.postgres_embeddings:main"
pvr-report = "product_variant_resolver.reporting:main"
pvr-compare-neural-rerankers = "product_variant_resolver.neural_reranker_comparison:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
