<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Example 2025 Vehicle Catalog</title>
  </head>
  <body>
    <main class="mw-parser-output">
      <h1 id="firstHeading">Example 2025 Vehicle Catalog</h1>
      <p>This local fixture imitates a JavaScript-rendered wiki catalog table.</p>
      <div id="catalog-root"></div>
      <table class="wikitable"><tr><th>Unrelated</th></tr><tr><td>Ignore me</td></tr></table>
    </main>
    <script>
      window.setTimeout(() => {
        document.getElementById("catalog-root").innerHTML = `
          <table class="sortable wikitable">
            <thead><tr>
              <th>Toy #</th><th>Col.#</th><th>Model Name</th><th>Series</th>
              <th>Series #</th><th>Color</th><th>Year</th>
            </tr></thead>
            <tbody>
              <tr><td>AAA01</td><td>001</td><td>Example Roadster</td><td>City Cars</td><td>1/5</td><td>Red</td><td>2025</td></tr>
              <tr><td>AAA02</td><td>002</td><td>Example Roadster (2nd Color - Zamac)</td><td>City Cars</td><td>1/5</td><td>Zamac</td><td>2025</td></tr>
              <tr><td>BBB01</td><td>003</td><td>Example Coupe</td><td>Track Stars</td><td>2/5</td><td>Blue</td><td>2025</td></tr>
              <tr><td>OLD01</td><td>099</td><td>Old Example</td><td>Archive</td><td>9/9</td><td>Black</td><td>2024</td></tr>
            </tbody>
          </table>`;
      }, 100);
    </script>
  </body>
</html>
